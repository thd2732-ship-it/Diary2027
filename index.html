<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E4D8;overflow:hidden;overscroll-behavior:none;
  font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#2B2A28}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.serif{font-family:'Noto Serif KR','Noto Serif CJK KR',Georgia,'Times New Roman',serif}
#view{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#track{position:absolute;left:0;top:0;right:0;bottom:0;will-change:transform}
.slot{position:absolute;top:0;width:100%;height:100%}
.pw{position:absolute;left:0;top:0;transform-origin:0 0}
.page{position:relative;width:390px;height:844px;background:#FBF9F4;overflow:hidden;box-shadow:0 0 0 1px rgba(43,42,40,.08),0 4px 24px rgba(43,42,40,.12);font-size:10px}
.layer{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none}
canvas.layer{width:390px;height:844px}
[data-act]{cursor:pointer;pointer-events:auto}
[data-act] svg{pointer-events:none}
.im{position:absolute;pointer-events:auto}
.im img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.im.sel{outline:1.5px solid #2F5FA7}
.hnd{position:absolute;pointer-events:auto;touch-action:none}
.hnd.imove{left:0;top:0;right:0;bottom:0;background:rgba(47,95,167,.06)}
.hnd.isize,.hnd.idel,.hnd.tmove,.hnd.tdel{width:26px;height:26px;border-radius:13px;background:#fff;border:1.5px solid #2F5FA7;display:flex;align-items:center;justify-content:center}
.hnd.isize{right:-13px;bottom:-13px}
.hnd.idel{right:-13px;top:-13px}
.hnd.tmove{left:-13px;top:-13px}
.hnd.tdel{right:-13px;top:-13px}
.hnd svg{pointer-events:none}
.tb{position:absolute;pointer-events:auto}
.tb textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:2px 4px;margin:0;font-family:inherit;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.tb:focus-within{outline:1px dashed rgba(43,42,40,.4)}
.tb .hnd{display:none}
.tb:focus-within .hnd{display:flex}

/* UI overlays */
#fab{position:fixed;right:0;bottom:0;width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;z-index:20}
#fab span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;background:rgba(43,42,40,.12)}
#quick{position:fixed;right:44px;bottom:0;height:44px;z-index:20;display:flex}
#quick button{width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
#quick span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;background:rgba(43,42,40,.12);color:#2B2A28}
#quick button.on span{background:#2B2A28;color:#fff}
#top{position:fixed;left:0;right:0;top:0;z-index:30;height:56px;padding:6px 6px 0;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.96);border-bottom:1px solid #E6DFD0}
#plabel{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;border-radius:10px}
.ib:disabled{opacity:.3}
.ibw{height:44px;border:0;background:#F3EEE2;border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;font-weight:500}
#panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;padding:8px 10px 10px;background:#fff;border-radius:18px;border:1px solid #E6DFD0;box-shadow:0 8px 28px rgba(43,42,40,.18);max-width:520px;margin:0 auto}
.grab{width:36px;height:4px;border-radius:2px;background:#CFC6B3;margin:0 auto 8px}
.tools{display:flex;justify-content:space-between}
.tool{flex:1 1 0;min-width:0;max-width:66px;height:54px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:10px;font-weight:500}
.tool.on{background:#2B2A28;color:#fff}
.colors{display:flex;justify-content:space-between;margin-top:6px;padding:0 2px}
.cb{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.cb span{display:block;width:26px;height:26px;border-radius:13px}
.hint{margin-top:8px;padding:8px 10px;border-radius:10px;background:#F3EEE2;font-size:11px;line-height:16px}
.seg{display:flex;gap:4px;padding:3px;background:#F3EEE2;border-radius:12px;margin-top:8px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;font-size:12px;font-weight:500}
.seg button.on{background:#2B2A28;color:#fff}
.row{display:flex;align-items:center;gap:10px;margin-top:2px;padding:0 4px}
.row label{font-size:11px;color:#6B665C;width:64px;flex:none}
.row input[type=range]{flex:1;height:44px;margin:0;accent-color:#B8431F}
.row2{display:flex;gap:8px;margin-top:2px}
.pill{flex:1;height:40px;border:1px solid #E0D8C6;border-radius:10px;background:#FBF9F4;font-size:12px;font-weight:500}
.pill.on{background:#2B2A28;color:#fff;border-color:#2B2A28}
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid #E6DFD0;padding:2px 6px;display:flex;align-items:center;justify-content:space-between;gap:4px;box-shadow:0 -4px 16px rgba(43,42,40,.12)}
#tbar .cb{width:36px;height:44px}
#tbar .cb span{width:22px;height:22px;border-radius:11px}
#tbar .tx{display:flex;align-items:center;gap:2px}
#tbar .tx button{min-width:40px;height:40px;border:0;border-radius:10px;background:#F3EEE2;font-size:13px;font-weight:700;padding:0 8px}
#tbar .tx button.done{background:#2B2A28;color:#fff;font-size:12px}
#sheetwrap{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50}
#scrim{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(43,42,40,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px 20px;box-shadow:0 -8px 28px rgba(43,42,40,.18);max-width:560px;margin:0 auto}
.sh{display:flex;align-items:center;justify-content:space-between;height:44px}
.sh b{font-size:16px}
.segs{display:flex;gap:4px;padding:3px;background:#F3EEE2;border-radius:12px}
.segs button{flex:1 1 0;min-width:0;height:44px;border:0;border-radius:10px;background:transparent;font-size:12px;font-weight:500;padding:0}
.segs button.on{background:#2B2A28;color:#fff}
.lbl{margin-top:14px;font-size:11px;font-weight:500;letter-spacing:.06em;color:#6B665C;display:flex;justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.chip{height:42px;border:1px solid #E0D8C6;border-radius:10px;background:#FBF9F4;font-size:13px;font-weight:500;padding:0}
.chip.on{background:#B8431F;border-color:#B8431F;color:#fff}
.wk{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;margin-top:4px;padding:0 14px;border:1px solid #E0D8C6;border-radius:10px;background:#FBF9F4;font-size:13px}
.wk.on{background:#FBE3D6;border-color:#E8B9A5}
.wk span{font-size:12px;color:#6B665C}
.thumb{position:relative;height:84px;border:1px solid #E0D8C6;border-radius:6px;background:#FBF9F4;overflow:hidden;padding:0}
.thumb.on{border:2px solid #B8431F}
.thumb i{position:absolute;left:6px;right:6px;top:8px;bottom:22px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 7px,#E0D8C6 7px,#E0D8C6 8px)}
.thumb b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;font-weight:500}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:14px;border:0;border-radius:12px;background:#B8431F;color:#fff;font-size:14px;font-weight:700}
.note{margin-top:8px;text-align:center;font-size:11px;color:#6B665C}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;max-width:88%;padding:10px 14px;border-radius:12px;background:rgba(43,42,40,.92);color:#fff;font-size:12px;line-height:17px;text-align:center}
</style>
</head>

<button id="fab" aria-label="메뉴 열기"><span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12"/></svg></span></button>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var PW=390,PH=844;
var KO=['월','화','수','목','금','토','일'];
var EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DEC'+'EMBER'];
var EN3=EN.map(function(s){return s.slice(0,3);});
var COLORS=[{c:'#2B2A28',n:'검정'},{c:'#2F5FA7',n:'파랑'},{c:'#C0392B',n:'빨강'},{c:'#2E7D4F',n:'초록'},{c:'#D9822B',n:'주황'},{c:'#7B4FA8',n:'보라'},{c:'#E3B91E',n:'노랑'}];
var TSIZES=[10,12,14,17,20,24];
var HOL={'2026-12-25':'성탄절','2027-1-1':'신정','2027-2-6':'설날 연휴','2027-2-7':'설날','2027-2-8':'설날 연휴','2027-2-9':'대체공휴일','2027-3-1':'삼일절','2027-5-1':'노동절','2027-5-3':'대체공휴일','2027-5-5':'어린이날','2027-5-13':'부처님오신날','2027-6-6':'현충일','2027-7-17':'제헌절','2027-7-19':'대체공휴일','2027-8-15':'광복절','2027-8-16':'대체공휴일','2027-9-14':'추석 연휴','2027-9-15':'추석','2027-9-16':'추석 연휴','2027-10-3':'개천절','2027-10-4':'대체공휴일','2027-10-9':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일','2028-1-1':'신정'};
var ICON={
  text:'M5 5h14M12 5v14M9 19h6',
  pen:'M4 20l1-4L16 5l3 3L8 19l-4 1zM13.5 7.5l3 3',
  hl:'M6 16l8-8 4 4-8 8H6zM14 8l2-2 4 4-2 2M12 21h9',
  erase:'M4 16l8-9 7 6-5 6H8zM9 20h11',
  photo:'M4 6h16v12H4zM4 15l5-5 4 4 3-3 4 4M15 9.5h.01',
  undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',
  redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',
  close:'M6 6l12 12M18 6L6 18',
  grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  plus:'M12 5v14M5 12h14',
  move:'M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3',
  size:'M5 19L19 5M19 5v8M19 5h-8',
  trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13'
};
function ico(n,w,col,sw){w=w||22;return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+ICON[n]+'"/></svg>';}
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function isoWeek(dt){var d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y0)/86400000+1)/7);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function monIdx(d){return (d.getDay()+6)%7;}

/* ---------- 설정 ---------- */
var ST={tool:'pen',color:'#2F5FA7',sizes:{pen:4,hl:6,erase:6},eraseMode:'partial',textSize:14,fingerDraw:false};

/* ---------- 저장소 ---------- */
var DB={db:null,mem:{},
  open:function(){var self=this;return new Promise(function(res){try{var rq=indexedDB.open('diary2027',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};rq.onsuccess=function(){self.db=rq.result;res(true);};rq.onerror=function(){res(false);};rq.onblocked=function(){res(false);};}catch(_){res(false);}});},
  get:function(k){var self=this;return new Promise(function(res){if(!self.db){res(self.mem[k]);return;}try{var r=self.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){res(undefined);};}catch(_){res(undefined);}});},
  set:function(k,v){var self=this;return new Promise(function(res){if(!self.db){self.mem[k]=v;res();return;}try{var tx=self.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(_){res();}});},
  all:function(){var self=this;return new Promise(function(res){if(!self.db){res(Object.assign({},self.mem));return;}var out={};try{var rq=self.db.transaction('kv').objectStore('kv').openCursor();rq.onsuccess=function(){var c=rq.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};rq.onerror=function(){res(out);};}catch(_){res(out);}});}
};
var CACHE={},dirty={},saveT=null;
function newData(){return {strokes:[],texts:[],images:[],circles:{},checks:{},memo:{}};}
function loadData(id){if(CACHE[id])return Promise.resolve(CACHE[id]);return DB.get('p:'+id).then(function(v){if(CACHE[id])return CACHE[id];var d=Object.assign(newData(),v||{});CACHE[id]=d;return d;});}
function markDirty(id){dirty[id]=1;clearTimeout(saveT);saveT=setTimeout(flush,500);}
function flush(){clearTimeout(saveT);var ids=Object.keys(dirty);dirty={};return ids.reduce(function(p,id){return p.then(function(){return DB.set('p:'+id,CACHE[id]);});},Promise.resolve());}
function saveSettings(){DB.set('settings',ST);}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
window.addEventListener('pagehide',flush);

/* ---------- 페이지 목록 ---------- */
var noteCount=10,PAGES=[];
function buildPages(){
  var P=[];
  P.push({id:'yn1',type:'yn',half:0,label:'이얼리노트 1/2',sec:'yn'});
  P.push({id:'yn2',type:'yn',half:1,label:'이얼리노트 2/2',sec:'yn'});
  P.push({id:'yp1',type:'yp',half:0,label:'이얼리플랜 1/2',sec:'yp'});
  P.push({id:'yp2',type:'yp',half:1,label:'이얼리플랜 2/2',sec:'yp'});
  for(var i=0;i<13;i++){var y=2026+Math.floor((11+i)/12),m=(11+i)%12;P.push({id:'m-'+y+'-'+(m+1),type:'m',y:y,m:m,label:'먼슬리 '+y+'.'+(m+1),sec:'m'});}
  var d=new Date(2026,10,30);
  for(var j=0;j<57;j++){P.push({id:'w-'+dkey(d),type:'w',date:new Date(d),label:'위클리 W'+isoWeek(d)+' · '+(d.getMonth()+1)+'.'+d.getDate(),sec:'w'});d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);}
  for(var n=1;n<=noteCount;n++)P.push({id:'n-'+n,type:'n',n:n,total:noteCount,label:'무지노트 '+n+'/'+noteCount,sec:'n'});
  PAGES=P;
}

/* ---------- 내지 HTML ---------- */
function chk(on){return '<span style="position:relative;display:block;width:11px;height:11px;border:1px solid rgba(43,42,40,.16);border-radius:2px;background:rgba(255,255,255,.5)">'+(on?'<svg width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="#1E7A45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:-2px;top:-3px"><path d="M2 6.5l3 3 5-7"/></svg>':'')+'</span>';}
function miniCal(y,m){
  var dim=new Date(y,m+1,0).getDate(),lead=(new Date(y,m,1).getDay()+6)%7;
  var s='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:4px">';
  KO.forEach(function(t,i){s+='<div style="height:13px;line-height:13px;text-align:center;font-size:7.5px;color:'+(i==5?'#3F67A8':i==6?'#B8431F':'#6B665C')+'">'+t+'</div>';});
  for(var k=0;k<42;k++){var d=k-lead+1;if(d<1||d>dim){s+='<div style="height:13px"></div>';continue;}
    var col=k%7,c='#2B2A28';if(col==5)c='#3F67A8';if(col==6||HOL[y+'-'+(m+1)+'-'+d])c='#B8431F';
    s+='<div style="height:13px;line-height:13px;text-align:center;font-size:8px;font-weight:500;color:'+c+'">'+d+'</div>';}
  return s+'</div>';
}
function pgYN(half){
  var s='<div style="position:absolute;left:16px;right:16px;top:26px;height:56px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1.5px solid #2B2A28;padding-bottom:10px"><div style="display:flex;align-items:baseline;gap:8px"><span class="serif" style="font-size:28px;line-height:1;font-weight:600">2027</span><span style="font-size:10px;font-weight:500;letter-spacing:.22em;color:#B8431F">YEARLY NOTE</span></div><div style="font-size:10px;color:#6B665C">기념일 · 버킷리스트 · 목표 &nbsp;<b style="font-weight:500;color:#2B2A28">'+(half?'7–12월':'1–6월')+'</b></div></div>';
  s+='<div style="position:absolute;left:16px;right:16px;top:96px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;row-gap:14px">';
  for(var i=0;i<6;i++){var m=half*6+i;
    s+='<div><div style="display:flex;align-items:baseline;gap:5px;height:26px;border-bottom:1px solid #CFC6B3"><span class="serif" style="font-size:20px;line-height:1;font-weight:600">'+(m+1)+'</span><span style="font-size:8px;letter-spacing:.12em;color:#6B665C">'+EN3[m]+'</span></div>'+miniCal(2027,m)+'<div style="height:68px;margin-top:6px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 16px,#DDD4C1 16px,#DDD4C1 17px)"></div></div>';}
  return s+'</div>';
}
function pgYP(half){
  var s='<div style="position:absolute;left:12px;right:12px;top:14px;height:16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:8px;font-weight:500;letter-spacing:.22em;color:#B8431F">2027 YEARLY PLAN</span><span style="font-size:8px;color:#6B665C">'+(half?'7–12':'1–6')+'</span></div>';
  s+='<div style="position:absolute;left:12px;right:12px;top:36px;display:flex;border-top:1px solid #2B2A28;border-right:1px solid #D9D0BE">';

function seg(c,st,a,b){c.lineWidth=st.w*(0.55+0.9*((a[2]+b[2])/2));c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}

  var pts=st.p;if(!pts||!pts.length)return;
  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=st.c;c.fillStyle=st.c;
  if(st.t==='hl'){
    c.globalAlpha=0.38;c.lineWidth=st.w;c.lineCap='butt';c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    if(pts.length===1)c.lineTo(pts[0][0]+0.01,pts[0][1]);
    for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
    c.stroke();
  }else if(pts.length===1){c.beginPath();c.arc(pts[0][0],pts[0][1],st.w*(0.55+0.9*pts[0][2])/2,0,Math.PI*2);c.fill();}

  c.restore();

  var a=st.p[st.p.length-1];
  if(a){var dx=x-a[0],dy=y-a[1],d=Math.hypot(dx,dy);if(d<0.4)return;
    if(d>3){var n=Math.floor(d/3);for(var i=1;i<=n;i++){var t=i/(n+1);st.p.push([+(a[0]+dx*t).toFixed(1),+(a[1]+dy*t).toFixed(1),+(a[2]+(p-a[2])*t).toFixed(2)]);}}}
  st.p.push([+x.toFixed(1),+y.toFixed(1),+p.toFixed(2)]);
}
function strokeLen(st){var l=0;for(var i=1;i<st.p.length;i++)l+=Math.hypot(st.p[i][0]-st.p[i-1][0],st.p[i][1]-st.p[i-1][1]);return l;}

  var c=g.slot.lctx,st=g.stroke;

  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=st.c;c.fillStyle=st.c;
  if(st.p.length===1&&g.drawn===0){c.beginPath();c.arc(st.p[0][0],st.p[0][1],st.w*(0.55+0.9*st.p[0][2])/2,0,Math.PI*2);c.fill();}
  for(var i=Math.max(1,g.drawn);i<st.p.length;i++)seg(c,st,st.p[i-1],st.p[i]);

  var changed=false,out=[];

    var rr=r+(s.t==='hl'?s.w/2:s.w*0.6),hit=false;
    for(var i=0;i<s.p.length;i++){var p=s.p[i];if((p[0]-x)*(p[0]-x)+(p[1]-y)*(p[1]-y)<=rr*rr){hit=true;break;}}

function beginSingle(e,hnd){

function endPtr(e,cancel){

    var p=jump.sec;h+='<div class="lbl"><span>페이지 선택</span></div><div class="grid4" style="grid-template-columns:repeat(2,1fr)"><button class="chip'+(curId===p+'1'?' on':'')+'" data-go="'+p+'1">1/2 · 1–6월</button><button class="chip'+(curId===p+'2'?' on':'')+'" data-go="'+p+'2">2/2 · 7–12월</button></div>';
  }else if(jump.sec==='m'||jump.sec==='w'){
    h+='<div class="lbl"><span>월 선택</span></div><div class="grid4">';
    for(var i=0;i<13;i++){var y=2026+Math.floor((11+i)/12),m=(11+i)%12,v=ymVal(y,m),lab=y===2026?'26.12':(m+1)+'월';
      if(jump.sec==='m')h+='<button class="chip'+(curId==='m-'+y+'-'+(m+1)?' on':'')+'" data-go="m-'+y+'-'+(m+1)+'">'+lab+'</button>';
      else h+='<button class="chip'+(jump.month===v?' on':'')+'" data-jm="'+v+'">'+lab+'</button>';}
    h+='</div>';
    if(jump.sec==='w'){
      var yy=Math.floor(jump.month/12),mm=jump.month%12,first=new Date(yy,mm,1),last=new Date(yy,mm+1,0);
      h+='<div class="lbl"><span>'+(yy===2026?'2026.12':(mm+1)+'월')+' · 주차 선택</span></div>';
      PAGES.forEach(function(p){if(p.type!=='w')return;var s=p.date,e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);if(e>=first&&s<=last){h+='<button class="wk'+(curId===p.id?' on':'')+'" data-go="'+p.id+'"><b>WEEK '+isoWeek(s)+'</b><span>'+(s.getMonth()+1)+'.'+s.getDate()+' – '+(e.getMonth()+1)+'.'+e.getDate()+'</span></button>';}});
    }
  }else{
    h+='<div class="lbl"><span>노트 페이지</span><span>'+noteCount+'p</span></div><div class="grid5">';
    for(var n=1;n<=noteCount;n++)h+='<button class="thumb'+(curId==='n-'+n?' on':'')+'" data-go="n-'+n+'" aria-label="노트 '+n+'"><i></i><b>'+n+'</b></button>';
    h+='</div><button class="big" data-x="addnote">'+ico('plus',18,'#fff',2.2)+'1페이지 추가</button><div class="note">누를 때마다 맨 뒤에 무지노트가 1장씩 늘어나요</div>';
  }
  h+='<div class="lbl" style="margin-top:22px"><span>백업</span></div><div class="row2"><button class="pill" data-x="export">백업 파일 저장</button><button class="pill" data-x="import">백업 불러오기</button></div><div class="note" style="text-align:left">폰 데이터를 지우거나 앱을 바꾸기 전에 백업을 저장해 두세요.</div>';
  sheet.innerHTML=h;
}
sheetwrap.addEventListener('click',function(e){
  if(e.target.id==='scrim'){closeSheet();return;}
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.sec){jump.sec=b.dataset.sec;renderSheet();}
  else if(b.dataset.jm){jump.month=parseInt(b.dataset.jm,10);renderSheet();}
  else if(b.dataset.go){closeSheet();setUI(false);goId(b.dataset.go);}
  else if(b.dataset.x==='close')closeSheet();
  else if(b.dataset.x==='addnote'){noteCount++;DB.set('meta',{notes:noteCount});buildPages();closeSheet();setUI(false);goId('n-'+noteCount);toast('무지노트 '+noteCount+'페이지를 추가했어요.');}
  else if(b.dataset.x==='export')exportAll();
  else if(b.dataset.x==='import')$('#importfile').click();
});
function exportAll(){
  flush().then(function(){return DB.all();}).then(function(all){
    var blob=new Blob([JSON.stringify({app:'diary2027',v:1,data:all})],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);var d=new Date();a.download='diary2027-backup-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('백업 파일을 저장했어요.');
  });
}
$('#importfile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);if(j.app!=='diary2027')throw 0;var keys=Object.keys(j.data);
    keys.reduce(function(p,k){return p.then(function(){return DB.set(k,j.data[k]);});},Promise.resolve()).then(function(){toast('백업을 불러왔어요. 앱을 다시 열어요.');setTimeout(function(){location.reload();},900);});
  }catch(_){toast('다이어리 백업 파일이 아니에요.');}};
  rd.readAsText(f);
});

var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.add('hidden');},2800);}

/* ---------- 시작 ---------- */
function init(){
  DB.open().then(function(ok){
    if(!ok)toast('저장 공간을 쓸 수 없어요. 이번에만 기록돼요.');
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    return Promise.all([DB.get('meta'),DB.get('settings')]);
  }).then(function(r){
    if(r[0]&&r[0].notes)noteCount=r[0].notes;
    if(r[1])Object.assign(ST,r[1]);
    ST.tool='pen';ST.sizes=Object.assign({pen:4,hl:6,erase:6},ST.sizes);
    buildPages();measure();renderQuick();
    for(var i=0;i<3;i++)S.push(makeSlot());
    var h=location.hash.slice(1),start=PAGES.findIndex(function(p){return p.id===h;});
    if(start<0)start=PAGES.findIndex(function(p){return p.id==='yp1';});
    return showAt(start);
  }).then(function(){
    if(location.hash==='#ui')setUI(true);
    if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){var had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)location.reload();});navigator.serviceWorker.register('sw.js').catch(function(){});}
  });
}
window.__diary={ST:ST,get cur(){return cur;},PAGES:function(){return PAGES;},showAt:showAt,S:function(){return S;},Z:Z};
init();
})();
</script>
